<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="header(pageTitle)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title th:text="${pageTitle != null ? pageTitle + ' - FINSIGHT' : 'FINSIGHT - Personal Finance Tracker'}">FINSIGHT - Personal Finance Tracker</title>
    
    <!-- CSRF Tokens for AJAX -->
    <meta name="_csrf" th:content="${_csrf != null ? _csrf.token : ''}">
    <meta name="_csrf_header" th:content="${_csrf != null ? _csrf.headerName : ''}">

    <!-- PWA & Mobile Metas -->
    <link rel="manifest" th:href="@{/manifest.json}">
    <meta name="theme-color" content="#4f46e5">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="FINSIGHT">
    <link rel="apple-touch-icon" sizes="180x180" th:href="@{/icons/apple-touch-icon.png}">
    <link rel="icon" type="image/png" sizes="32x32" th:href="@{/icons/favicon-32x32.png}">
    <link rel="icon" type="image/png" sizes="16x16" th:href="@{/icons/favicon-16x16.png}">
    <link rel="shortcut icon" th:href="@{/favicon.ico}">
    <link rel="icon" type="image/svg+xml" th:href="@{/icons/icon.svg}">
    
    <!-- Fonts & Styles -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<!-- Sidebar Fragment -->
<aside th:fragment="sidebar" class="sidebar">
    <div class="sidebar-header">
        <img th:src="@{/icons/icon-192x192.png}" alt="FINSIGHT Logo" class="brand-logo" width="40" height="40">
        <div>
            <div class="brand-title">FINSIGHT</div>
            <div class="brand-subtitle">Personal Wealth Manager</div>
        </div>
    </div>
    <nav class="sidebar-nav">
        <a th:href="@{/dashboard}" class="nav-link" th:classappend="${activeTab == 'dashboard'} ? 'active'">
            <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
            Dashboard
        </a>
        <a th:href="@{/income}" class="nav-link" th:classappend="${activeTab == 'income'} ? 'active'">
            <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/></svg>
            Income
        </a>
        <a th:href="@{/expense}" class="nav-link" th:classappend="${activeTab == 'expense'} ? 'active'">
            <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M20 12H4"/></svg>
            Expenses
        </a>
        <a th:href="@{/budgets}" class="nav-link" th:classappend="${activeTab == 'budgets'} ? 'active'">
            <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/></svg>
            Budgets
        </a>
        <a th:href="@{/subscriptions}" class="nav-link" th:classappend="${activeTab == 'subscriptions'} ? 'active'">
            <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
            Subscriptions
        </a>
        <a th:href="@{/transactions}" class="nav-link" th:classappend="${activeTab == 'transactions'} ? 'active'">
            <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 10h16M4 14h16M4 18h16"/></svg>
            History
        </a>
        <a th:href="@{/reports}" class="nav-link" th:classappend="${activeTab == 'reports'} ? 'active'">
            <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
            Reports & Export
        </a>
    </nav>
    <div class="sidebar-footer">
        <div>v1.0.0 &bull; Java 21 &bull; PWA Ready</div>
        <div style="font-size: 0.725rem; margin-top: 4px; color: #64748b;">H2 / PostgreSQL &bull; Offline Capable</div>
    </div>
</aside>

<!-- Topbar Fragment -->
<header th:fragment="topbar(title)" class="top-navbar">
    <div style="display: flex; align-items: center; gap: 0.75rem;">
        <h1 class="page-title" th:text="${title ?: 'Dashboard'}">Dashboard</h1>
        <span id="offline-indicator" class="offline-pill" style="display:none;" title="Device is currently offline">
            <span class="offline-dot"></span> Offline
        </span>
    </div>
    <div style="display: flex; align-items: center; gap: 0.75rem;">
        <button id="pwa-install-btn" class="btn btn-sm btn-install-pwa" style="display:none;" type="button">
            <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
            <span>Install App</span>
        </button>
        <div class="user-profile" sec:authorize="isAuthenticated()">
            <div class="user-avatar" th:text="${#authentication.principal instanceof T(com.aswin.financetracker.service.CustomUserDetails) ? #strings.substring(#authentication.principal.fullName, 0, 1).toUpperCase() : 'U'}">U</div>
            <div class="user-profile-text">
                <div style="font-size: 0.85rem; font-weight: 600;" th:text="${#authentication.principal instanceof T(com.aswin.financetracker.service.CustomUserDetails) ? #authentication.principal.fullName : #authentication.name}">User</div>
                <div style="font-size: 0.75rem; color: var(--text-muted);" th:text="${#authentication.name}">user@example.com</div>
            </div>
            <form th:action="@{/logout}" method="post" style="display:inline; margin-left: 0.5rem;">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                <button type="submit" class="btn btn-sm" title="Sign out" style="padding: 0.35rem 0.65rem; font-size: 0.75rem; border-radius: 6px; cursor: pointer; border: 1px solid #ef4444; color: #ef4444; background: transparent; font-weight: 600;">
                    Logout
                </button>
            </form>
        </div>
    </div>
</header>

<!-- Alerts Fragment -->
<div th:fragment="alerts">
    <div th:if="${successMessage}" class="alert alert-success">
        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>
        <span th:text="${successMessage}"></span>
    </div>
    <div th:if="${warningMessage}" class="alert alert-warning">
        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>
        <span th:text="${warningMessage}"></span>
    </div>
    <div th:if="${errorMessage}" class="alert alert-danger">
        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>
        <span th:text="${errorMessage}"></span>
    </div>
</div>

<!-- Mobile Bottom Navigation Fragment -->
<nav th:fragment="mobileNav" class="mobile-bottom-nav">
    <a th:href="@{/dashboard}" class="mobile-nav-item" th:classappend="${activeTab == 'dashboard'} ? 'active'">
        <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
        <span>Home</span>
    </a>
    <a th:href="@{/transactions}" class="mobile-nav-item" th:classappend="${activeTab == 'transactions'} ? 'active'">
        <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 10h16M4 14h16M4 18h16"/></svg>
        <span>Ledger</span>
    </a>
    <a th:href="@{/expense}" class="mobile-nav-item" th:classappend="${activeTab == 'expense'} ? 'active'">
        <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M20 12H4"/></svg>
        <span>Expenses</span>
    </a>
    <a th:href="@{/income}" class="mobile-nav-item" th:classappend="${activeTab == 'income'} ? 'active'">
        <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/></svg>
        <span>Income</span>
    </a>
    <a th:href="@{/budgets}" class="mobile-nav-item" th:classappend="${activeTab == 'budgets'} ? 'active'">
        <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/></svg>
        <span>Budgets</span>
    </a>
    <a th:href="@{/subscriptions}" class="mobile-nav-item" th:classappend="${activeTab == 'subscriptions'} ? 'active'">
        <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
        <span>Subs</span>
    </a>
    <a th:href="@{/reports}" class="mobile-nav-item" th:classappend="${activeTab == 'reports'} ? 'active'">
        <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
        <span>Reports</span>
    </a>
</nav>

<!-- Scripts Fragment -->
<div th:fragment="scripts">
    <script th:src="@{/js/charts.js}"></script>
    <script th:src="@{/js/app.js}"></script>
    <div th:replace="~{layout/main :: mobileNav}"></div>
</div>

</body>
</html>
