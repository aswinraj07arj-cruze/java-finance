<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>Create Account - FINSIGHT</title>
    <link rel="manifest" th:href="@{/manifest.json}">
    <meta name="theme-color" content="#4f46e5">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <link rel="apple-touch-icon" sizes="180x180" th:href="@{/icons/apple-touch-icon.png}">
    <link rel="icon" type="image/png" sizes="32x32" th:href="@{/icons/favicon-32x32.png}">
    <link rel="icon" type="image/png" sizes="16x16" th:href="@{/icons/favicon-16x16.png}">
    <link rel="shortcut icon" th:href="@{/favicon.ico}">
    <link rel="icon" type="image/svg+xml" th:href="@{/icons/icon.svg}">
</head>
<body style="background: linear-gradient(135deg, #f8fafc 0%, #eef2ff 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1.5rem;">
    <div style="width: 100%; max-width: 440px; background: var(--bg-card); border-radius: var(--radius-lg); box-shadow: var(--shadow-lg); border: 1px solid var(--border); overflow: hidden;">
        <div style="background: var(--bg-sidebar); padding: 2rem; text-align: center; color: white;">
            <img th:src="@{/icons/icon-192x192.png}" alt="FINSIGHT Logo" width="56" height="56" style="border-radius: 14px; box-shadow: 0 6px 16px rgba(0,0,0,0.35); margin-bottom: 0.75rem; object-fit: contain;">
            <h2 style="font-size: 1.35rem; font-weight: 700;">FINSIGHT</h2>
            <p style="color: #94a3b8; font-size: 0.85rem; margin-top: 0.25rem;">Create your personal account</p>
        </div>
        
        <div style="padding: 2rem;">
            <form th:action="@{/register}" th:object="${registerDto}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                <!-- Full Name -->
                <div class="form-group" style="margin-bottom: 1.25rem;">
                    <label for="fullName" style="display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 0.4rem; color: var(--text-main);">Full Name</label>
                    <input type="text" id="fullName" th:field="*{fullName}" class="form-control" placeholder="e.g. Aswin Raj" required autofocus style="width: 100%; padding: 0.75rem 1rem; border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: 0.95rem;">
                    <div th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}" style="color: var(--danger); font-size: 0.8rem; margin-top: 0.35rem; font-weight: 500;"></div>
                </div>

                <!-- Email -->
                <div class="form-group" style="margin-bottom: 1.25rem;">
                    <label for="email" style="display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 0.4rem; color: var(--text-main);">Email Address</label>
                    <input type="email" id="email" th:field="*{email}" class="form-control" placeholder="you@example.com" required style="width: 100%; padding: 0.75rem 1rem; border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: 0.95rem;">
                    <div th:if="${#fields.hasErrors('email')}" th:errors="*{email}" style="color: var(--danger); font-size: 0.8rem; margin-top: 0.35rem; font-weight: 500;"></div>
                </div>

                <!-- Password -->
                <div class="form-group" style="margin-bottom: 1.25rem;">
                    <label for="password" style="display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 0.4rem; color: var(--text-main);">Password (min 8 chars)</label>
                    <input type="password" id="password" th:field="*{password}" class="form-control" placeholder="••••••••" required style="width: 100%; padding: 0.75rem 1rem; border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: 0.95rem;">
                    <div th:if="${#fields.hasErrors('password')}" th:errors="*{password}" style="color: var(--danger); font-size: 0.8rem; margin-top: 0.35rem; font-weight: 500;"></div>
                </div>

                <!-- Confirm Password -->
                <div class="form-group" style="margin-bottom: 1.5rem;">
                    <label for="confirmPassword" style="display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 0.4rem; color: var(--text-main);">Confirm Password</label>
                    <input type="password" id="confirmPassword" th:field="*{confirmPassword}" class="form-control" placeholder="••••••••" required style="width: 100%; padding: 0.75rem 1rem; border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: 0.95rem;">
                    <div th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}" style="color: var(--danger); font-size: 0.8rem; margin-top: 0.35rem; font-weight: 500;"></div>
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.85rem; font-weight: 600; font-size: 1rem; border-radius: var(--radius-sm); background: var(--primary); color: white; border: none; cursor: pointer; transition: background 0.2s;">
                    Create Account
                </button>
            </form>

            <div style="margin-top: 1.75rem; text-align: center; font-size: 0.875rem; color: var(--text-muted); border-top: 1px solid var(--border); padding-top: 1.25rem;">
                Already have an account? 
                <a th:href="@{/login}" style="color: var(--primary); font-weight: 600; text-decoration: none;">Sign in here</a>
            </div>
        </div>
    </div>
</body>
</html>
