<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>Sign In - Personal Finance Tracker</title>
    <link rel="manifest" th:href="@{/manifest.json}">
    <meta name="theme-color" content="#4f46e5">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <link rel="icon" type="image/svg+xml" th:href="@{/icons/icon.svg}">
</head>
<body style="background: linear-gradient(135deg, #f8fafc 0%, #eef2ff 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1.5rem;">
    <div style="width: 100%; max-width: 420px; background: var(--bg-card); border-radius: var(--radius-lg); box-shadow: var(--shadow-lg); border: 1px solid var(--border); overflow: hidden;">
        <div style="background: var(--bg-sidebar); padding: 2rem; text-align: center; color: white;">
            <div style="width: 48px; height: 48px; background: var(--primary); border-radius: 12px; display: inline-flex; align-items: center; justify-content: center; font-size: 1.5rem; font-weight: 800; margin-bottom: 0.75rem;">₹</div>
            <h2 style="font-size: 1.35rem; font-weight: 700;">FinanceTracker</h2>
            <p style="color: #94a3b8; font-size: 0.85rem; margin-top: 0.25rem;">Sign in to your personal wealth account</p>
        </div>
        
        <div style="padding: 2rem;">
            <!-- Success message (e.g. from registration) -->
            <div th:if="${successMessage}" class="alert alert-success" style="margin-bottom: 1.25rem; font-size: 0.85rem;">
                <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>
                <span th:text="${successMessage}"></span>
            </div>

            <!-- Login Error Message -->
            <div th:if="${param.error}" class="alert alert-danger" style="margin-bottom: 1.25rem; font-size: 0.85rem;">
                <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>
                <span>Invalid email or password. Please try again.</span>
            </div>

            <!-- Logout Notice -->
            <div th:if="${param.logout}" class="alert alert-warning" style="margin-bottom: 1.25rem; font-size: 0.85rem;">
                <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                <span>You have been signed out successfully.</span>
            </div>

            <form th:action="@{/login}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                <div class="form-group" style="margin-bottom: 1.25rem;">
                    <label for="email" style="display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 0.4rem; color: var(--text-main);">Email Address</label>
                    <input type="email" id="email" name="email" class="form-control" placeholder="you@example.com" required autofocus style="width: 100%; padding: 0.75rem 1rem; border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: 0.95rem;">
                </div>

                <div class="form-group" style="margin-bottom: 1.5rem;">
                    <label for="password" style="display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 0.4rem; color: var(--text-main);">Password</label>
                    <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required style="width: 100%; padding: 0.75rem 1rem; border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: 0.95rem;">
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.85rem; font-weight: 600; font-size: 1rem; border-radius: var(--radius-sm); background: var(--primary); color: white; border: none; cursor: pointer; transition: background 0.2s;">
                    Sign In
                </button>
            </form>

            <div style="margin-top: 1.75rem; text-align: center; font-size: 0.875rem; color: var(--text-muted); border-top: 1px solid var(--border); padding-top: 1.25rem;">
                Don't have an account? 
                <a th:href="@{/register}" style="color: var(--primary); font-weight: 600; text-decoration: none;">Create one here</a>
            </div>
        </div>
    </div>
</body>
</html>
