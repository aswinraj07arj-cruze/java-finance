<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/main :: header('Expense Tracking')}"></head>
<body>
<div class="app-container">
    <aside th:replace="~{layout/main :: sidebar}"></aside>
    <div class="main-wrapper">
        <header th:replace="~{layout/main :: topbar('Expense Tracking')}"></header>
        <main class="content-body">
            <div th:replace="~{layout/main :: alerts}"></div>

            <!-- Add Expense Card Form -->
            <div class="card">
                <div class="card-header">
                    <div class="card-title">Record New Expense</div>
                </div>
                <div class="card-body">
                    <form th:action="@{/expense}" th:object="${expenseForm}" method="post">
                        <div class="form-grid">
                            <div class="form-group">
                                <label class="form-label" for="amount">Amount ($)</label>
                                <input type="number" step="0.01" class="form-control" id="amount" th:field="*{amount}" placeholder="e.g. 45.50" required>
                                <div class="form-error" th:if="${#fields.hasErrors('amount')}" th:errors="*{amount}"></div>
                            </div>

                            <div class="form-group">
                                <label class="form-label" for="category">Category</label>
                                <select class="form-control" id="category" th:field="*{category}" required>
                                    <option value="">-- Select Category --</option>
                                    <option th:each="cat : ${categories}" th:value="${cat}" th:text="${cat.displayName}">Food</option>
                                </select>
                                <div class="form-error" th:if="${#fields.hasErrors('category')}" th:errors="*{category}"></div>
                            </div>

                            <div class="form-group">
                                <label class="form-label" for="date">Date</label>
                                <input type="date" class="form-control" id="date" th:field="*{date}" required>
                                <div class="form-error" th:if="${#fields.hasErrors('date')}" th:errors="*{date}"></div>
                            </div>

                            <div class="form-group">
                                <label class="form-label" for="description">Description</label>
                                <input type="text" class="form-control" id="description" th:field="*{description}" placeholder="e.g. Grocery store, subway pass" required>
                                <div class="form-error" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></div>
                            </div>
                        </div>
                        <div style="display: flex; justify-content: flex-end; margin-top: 1rem;">
                            <button type="submit" class="btn btn-danger">+ Add Expense</button>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Filter Bar -->
            <form th:action="@{/expense}" method="get" class="filter-bar">
                <div style="flex: 1; min-width: 150px;">
                    <label class="form-label">Start Date</label>
                    <input type="date" name="startDate" th:value="${startDate}" class="form-control">
                </div>
                <div style="flex: 1; min-width: 150px;">
                    <label class="form-label">End Date</label>
                    <input type="date" name="endDate" th:value="${endDate}" class="form-control">
                </div>
                <div style="flex: 1; min-width: 150px;">
                    <label class="form-label">Category</label>
                    <select name="category" class="form-control">
                        <option value="">All Categories</option>
                        <option th:each="c : ${categories}" th:value="${c}" th:text="${c.displayName}" th:selected="${selectedCategory == c}">Category</option>
                    </select>
                </div>
                <div>
                    <button type="submit" class="btn btn-primary">Filter</button>
                    <a th:href="@{/expense}" class="btn btn-secondary" style="margin-left: 0.5rem;">Reset</a>
                </div>
            </form>

            <!-- Expenses List Table -->
            <div class="card">
                <div class="card-header">
                    <div class="card-title">Expense History</div>
                    <span style="font-size: 0.85rem; color: var(--text-muted);" th:text="${expenses.size()} + ' records found'">0 records</span>
                </div>
                <div class="table-responsive">
                    <table class="table">
                        <thead>
                        <tr>
                            <th>Date</th>
                            <th>Category</th>
                            <th>Description</th>
                            <th style="text-align: right;">Amount</th>
                            <th style="text-align: right;">Actions</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:if="${expenses.isEmpty()}">
                            <td colspan="5" style="text-align: center; color: var(--text-muted); padding: 2rem;">No expense records found matching the filter criteria.</td>
                        </tr>
                        <tr th:each="exp : ${expenses}">
                            <td th:text="${exp.date}">2026-09-01</td>
                            <td>
                                <span class="badge" th:classappend="${exp.category.badgeClass}" th:text="${exp.category.displayName}">Food</span>
                            </td>
                            <td th:text="${exp.description}">Grocery store</td>
                            <td style="text-align: right; font-weight: 700; color: #dc2626;">
                                -&#8377;<span th:text="${#numbers.formatDecimal(exp.amount, 1, 'COMMA', 2, 'POINT')}">0.00</span>
                            </td>
                            <td style="text-align: right;">
                                <a th:href="@{'/expense/edit/' + ${exp.id}}" class="btn btn-sm btn-secondary">Edit</a>
                                <form th:action="@{'/expense/delete/' + ${exp.id}}" method="post" style="display:inline; margin-left: 0.25rem;" onsubmit="return confirm('Are you sure you want to delete this expense record?');">
                                    <button type="submit" class="btn btn-sm btn-danger">Delete</button>
                                </form>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
</div>
<div th:replace="~{layout/main :: scripts}"></div>
</body>
</html>
