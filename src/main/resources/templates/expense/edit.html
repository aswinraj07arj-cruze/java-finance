<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/main :: header('Edit Expense')}"></head>
<body>
<div class="app-container">
    <aside th:replace="~{layout/main :: sidebar}"></aside>
    <div class="main-wrapper">
        <header th:replace="~{layout/main :: topbar('Edit Expense')}"></header>
        <main class="content-body">
            <div th:replace="~{layout/main :: alerts}"></div>

            <div class="card" style="max-width: 600px; margin: 0 auto;">
                <div class="card-header">
                    <div class="card-title">Edit Expense Record</div>
                    <a th:href="@{/expense}" class="btn btn-sm btn-secondary">Back to List</a>
                </div>
                <div class="card-body">
                    <form th:action="@{'/expense/edit/' + ${expenseForm.id}}" th:object="${expenseForm}" method="post">
                        <div class="form-group">
                            <label class="form-label" for="amount">Amount ($)</label>
                            <input type="number" step="0.01" class="form-control" id="amount" th:field="*{amount}" required>
                            <div class="form-error" th:if="${#fields.hasErrors('amount')}" th:errors="*{amount}"></div>
                        </div>

                        <div class="form-group">
                            <label class="form-label" for="category">Category</label>
                            <select class="form-control" id="category" th:field="*{category}" required>
                                <option th:each="cat : ${categories}" th:value="${cat}" th:text="${cat.displayName}">Food</option>
                            </select>
                            <div class="form-error" th:if="${#fields.hasErrors('category')}" th:errors="*{category}"></div>
                        </div>

                        <div class="form-group">
                            <label class="form-label" for="date">Date</label>
                            <input type="date" class="form-control" id="date" th:field="*{date}" required>
                            <div class="form-error" th:if="${#fields.hasErrors('date')}" th:errors="*{date}"></div>
                        </div>

                        <div class="form-group">
                            <label class="form-label" for="description">Description</label>
                            <input type="text" class="form-control" id="description" th:field="*{description}" required>
                            <div class="form-error" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></div>
                        </div>

                        <div style="display: flex; justify-content: flex-end; gap: 0.75rem; margin-top: 1.5rem;">
                            <a th:href="@{/expense}" class="btn btn-secondary">Cancel</a>
                            <button type="submit" class="btn btn-primary">Save Changes</button>
                        </div>
                    </form>
                </div>
            </div>
        </main>
    </div>
</div>
<div th:replace="~{layout/main :: scripts}"></div>
</body>
</html>
