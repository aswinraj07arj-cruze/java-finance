# Local Development Profile (H2 persistent file storage)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/financetracker}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# JPA / Hibernate for dev
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true

# H2 Console (Accessible at http://localhost:8080/h2-console for local development)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# Non-secure session cookie for local HTTP development
server.servlet.session.cookie.secure=false

# Flyway disabled for local dev H2
spring.flyway.enabled=false
