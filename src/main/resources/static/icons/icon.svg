<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="50%" stop-color="#4338ca"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="trendGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Base with Rounded Corners -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)"/>

  <!-- Subtle Inner Ring Accent -->
  <rect x="24" y="24" width="464" height="464" rx="92" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="3"/>

  <!-- Financial Trend Growth Area (Subtle Background) -->
  <path d="M 80 370 Q 180 360, 240 300 T 380 210 L 432 170 L 432 400 L 80 400 Z" fill="url(#glowGrad)"/>

  <!-- Trend Line with Glow -->
  <path d="M 80 370 Q 180 360, 240 300 T 380 210 L 432 170" fill="none" stroke="url(#trendGrad)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" filter="url(#dropShadow)"/>

  <!-- Upward Trend Arrow Cap -->
  <polygon points="410,165 442,162 438,194" fill="#60a5fa"/>

  <!-- Indian Rupee Currency Symbol (₹) -->
  <g filter="url(#dropShadow)">
    <!-- Top Horizontal Bar -->
    <rect x="146" y="140" width="160" height="24" rx="12" fill="#ffffff"/>
    <!-- Second Horizontal Bar -->
    <rect x="146" y="194" width="136" height="24" rx="12" fill="#ffffff"/>
    <!-- Vertical Spine -->
    <rect x="180" y="140" width="26" height="150" rx="12" fill="#ffffff"/>
    <!-- Upper Loop Arc -->
    <path d="M 194 140 C 290 140, 290 260, 194 260" fill="none" stroke="#ffffff" stroke-width="26" stroke-linecap="round"/>
    <!-- Diagonal Leg -->
    <path d="M 210 250 L 320 375" stroke="#ffffff" stroke-width="26" stroke-linecap="round"/>
  </g>

  <!-- Accent Shimmer Dot at Peak -->
  <circle cx="432" cy="170" r="10" fill="#ffffff" filter="url(#dropShadow)"/>
</svg>
