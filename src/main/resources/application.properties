# Application Configuration
spring.application.name=finance-tracker
server.port=${PORT:8080}
server.address=0.0.0.0

# Database Configuration (Persistent file-backed H2 storage)
# Supports SPRING_DATASOURCE_* environment variables with fallback to local defaults:
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/financetracker}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# JPA / Hibernate Configuration
# ddl-auto=update preserves existing database tables and records across restarts
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 Console (Accessible at http://localhost:8080/h2-console for local development)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# Thymeleaf Template Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.encoding=UTF-8
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
server.servlet.encoding.enabled=true
