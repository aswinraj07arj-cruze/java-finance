# Production Profile (Render / PostgreSQL)
# Supports standard SPRING_DATASOURCE_* variables with fallback to Render DATABASE_URL/DB_*
spring.datasource.url=${SPRING_DATASOURCE_URL:${DATABASE_URL}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USERNAME}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD}}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Disable H2 console in production
spring.h2.console.enabled=false

# Secure session cookies over HTTPS
server.servlet.session.cookie.secure=true

# Flyway Migrations for Production
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# Legacy Account Claim
app.legacy-owner-email=${LEGACY_OWNER_EMAIL:aswin@example.com}
